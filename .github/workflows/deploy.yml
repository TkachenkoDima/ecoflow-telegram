name: Deploy worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            ECOFLOW_ACCESS_KEY
            ECOFLOW_SECRET_KEY
            EF_EMAIL
            EF_PASSWORD
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            TG_WEBHOOK_SECRET
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          EF_EMAIL: ${{ secrets.EF_EMAIL }}
          EF_PASSWORD: ${{ secrets.EF_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
      - name: Telegram webhook
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL || steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$WORKER_URL" ]; then echo "Не вдалося визначити URL воркера — задайте змінну репозиторію WORKER_URL"; exit 1; fi
          echo "Webhook → ${WORKER_URL}/telegram"
          curl -sf "https://api.telegram.org/bot${TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}/telegram" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]'
